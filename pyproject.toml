[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aptjeeves"
version = "0.2.0"
description = "Local-first privacy-aware apartment chat ingestion foundation."
readme = "doc/detailed-design.md"
requires-python = ">=3.11"
dependencies = [
  "openai>=1.0",
  "langfuse>=2.31.0,<3.0.0",
  "fastapi",
  "uvicorn",
  "python-dotenv",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
]

[project.scripts]
aptjeeves = "aptjeeves.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
